<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOAC inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: dark;
  --bg-0: #08111b;
  --bg-1: #101b28;
  --bg-2: #172537;
  --ink-0: #e8f0fb;
  --ink-1: #9db0c7;
  --ink-2: #6f8198;
  --accent: #4fd1bd;
  --accent-soft: rgba(79, 209, 189, 0.16);
  --card: rgba(13, 21, 32, 0.82);
  --card-strong: rgba(18, 28, 41, 0.94);
  --line: rgba(173, 201, 228, 0.12);
  --line-strong: rgba(173, 201, 228, 0.24);
  --jump: rgba(255, 138, 101, 0.95);
  --panel-min-width: 120ch;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Manrope", "Segoe UI", sans-serif;
  color: var(--ink-0);
  background: linear-gradient(160deg, var(--bg-0), var(--bg-1) 48%, var(--bg-2));
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  gap: 14px;
  padding: 14px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--card);
  border: 1px solid var(--line-strong);
  backdrop-filter: blur(10px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.34);
}

.title {
  font-size: 1.02rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.subtitle {
  font-size: 0.82rem;
  color: var(--ink-1);
}

.status {
  font-size: 0.8rem;
  color: var(--ink-1);
  white-space: nowrap;
}

.inspector-layout {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  min-height: 0;
}

.top-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  min-height: 310px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 280px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
}

.views-panel {
  flex: 1;
  min-height: 460px;
}

.panel-head {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: linear-gradient(
    to right,
    rgba(29, 43, 61, 0.96),
    rgba(17, 27, 40, 0.82)
  );
}

.panel-title {
  font-weight: 700;
  font-size: 0.88rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.panel-head-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.panel-substatus {
  font-size: 0.74rem;
  color: var(--ink-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

textarea,
pre,
code {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}

textarea {
  width: 100%;
  flex: 1;
  min-height: 0;
  border: none;
  outline: none;
  resize: none;
  padding: 14px;
  font-size: 0.83rem;
  line-height: 1.4;
  background: rgba(8, 14, 22, 0.34);
  color: var(--ink-0);
}

textarea::placeholder {
  color: var(--ink-2);
}

pre {
  margin: 0;
  padding: 12px 14px;
  overflow: auto;
  flex: 1;
  min-height: 0;
  font-size: 0.78rem;
  line-height: 1.44;
  color: var(--ink-0);
  background: rgba(8, 14, 22, 0.28);
  white-space: pre;
}

.linked-block-line {
  display: block;
  margin: 0 -14px;
  min-height: 1.44em;
  padding: 0 14px;
  position: relative;
}

.linked-block-line.linked-block-target {
  background: rgba(79, 209, 189, 0.14);
  outline: 1px solid rgba(79, 209, 189, 0.32);
}

.block-target {
  position: absolute;
  top: -8px;
}

.block-link {
  color: #8ad7ff;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.block-link:hover {
  color: var(--accent);
}

.panel-body {
  flex: 1;
  min-height: 0;
  display: flex;
}

.view-tabs {
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: rgba(8, 14, 22, 0.24);
}

.view-tab {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  background: rgba(18, 29, 44, 0.9);
  color: var(--ink-1);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.74rem;
  cursor: pointer;
}

.view-tab.active {
  border-color: var(--line-strong);
  color: var(--ink-0);
  background: var(--accent-soft);
}

.view-body {
  flex-direction: column;
  overflow: hidden;
}

.typed-metadata {
  min-width: 0;
  padding: 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(8, 14, 22, 0.16);
}

.typed-metadata[hidden] {
  display: none;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.summary-item,
.decision-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(10, 17, 26, 0.72);
}

.summary-item {
  padding: 10px;
  min-width: 0;
}

.summary-label,
.decision-kind {
  font-size: 0.68rem;
  color: var(--ink-1);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.summary-value {
  margin-top: 4px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.84rem;
  color: var(--ink-0);
  overflow-wrap: anywhere;
}

.summary-detail,
.decision-detail,
.decision-source,
.decision-metadata {
  margin-top: 6px;
  font-size: 0.73rem;
  line-height: 1.35;
  color: var(--ink-1);
  overflow-wrap: anywhere;
}

.decision-list {
  display: grid;
  gap: 8px;
  margin-bottom: 12px;
}

.decision-card {
  padding: 9px 10px;
}

.decision-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.decision-title {
  margin-top: 3px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.78rem;
  color: #d8e4f1;
  overflow-wrap: anywhere;
}

.decision-status {
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 0.68rem;
  color: var(--ink-0);
  background: rgba(79, 209, 189, 0.12);
  white-space: nowrap;
}

.decision-status.rejected,
.decision-status.error {
  color: #ffb08f;
  background: rgba(255, 138, 101, 0.12);
}

.optimization-detail {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(8, 14, 22, 0.38);
  margin-top: 10px;
  overflow: hidden;
}

.optimization-detail summary {
  cursor: pointer;
  padding: 8px 10px;
  font-size: 0.74rem;
  color: var(--ink-1);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--line);
}

.optimization-detail pre {
  max-height: 460px;
  background: transparent;
}

.select-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.72rem;
  color: var(--ink-1);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

select {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 8px;
  background: rgba(18, 29, 44, 0.95);
  color: var(--ink-0);
}

.structure-root {
  position: relative;
  overflow: auto;
  min-width: 0;
  flex: 1;
  min-height: 0;
  padding: 12px;
}

.graphviz-root {
  padding: 12px;
  overflow: auto;
  min-width: 0;
  flex: 1;
  min-height: 0;
}

.graphviz-root svg {
  display: block;
  min-width: max-content;
}

.graphviz-root svg text,
.graphviz-root svg tspan {
  fill: var(--ink-0) !important;
}

.graphviz-root svg .node polygon,
.graphviz-root svg .node ellipse,
.graphviz-root svg .node path {
  fill: rgba(18, 29, 44, 0.96) !important;
  stroke: var(--line-strong) !important;
}

.graphviz-root svg .edge path,
.graphviz-root svg .edge polygon,
.graphviz-root svg .edge polyline {
  stroke: rgba(157, 176, 199, 0.82) !important;
  fill: rgba(157, 176, 199, 0.82) !important;
}

.tree-layer {
  position: relative;
  z-index: 2;
  min-width: max-content;
}

.link-layer {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: visible;
}

.node {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  background: var(--card-strong);
  margin-bottom: 8px;
  min-width: 340px;
}

.node-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.node-label {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.78rem;
  font-weight: 500;
  color: #8ad7ff;
}

.node-term {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.72rem;
  color: #c7d6e8;
  background: rgba(39, 56, 76, 0.9);
  border-radius: 8px;
  padding: 3px 6px;
}

.node-ops {
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(9, 16, 24, 0.78);
  padding: 6px;
  white-space: pre-wrap;
  font-size: 0.72rem;
  color: #d8e4f1;
}

.node-children {
  margin-left: 24px;
  padding-left: 12px;
  border-left: 2px solid rgba(79, 209, 189, 0.22);
}

.placeholder {
  font-size: 0.82rem;
  color: var(--ink-1);
  padding: 18px;
}

@media (max-width: 1200px) {
  .top-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .summary-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .node {
    min-width: 0;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="title">SOAC inspector</div>
      <div class="subtitle" id="contextStatus">ready</div>
    </div>
    <div class="status" id="status">ready</div>
  </div>

  <main class="inspector-layout">
    <div class="top-grid">
      <section class="panel source-panel">
        <div class="panel-head">
          <div class="panel-title">Python source</div>
          <div class="select-wrap">
            <label for="sourceSample">Program</label>
            <select id="sourceSample"></select>
          </div>
        </div>
        <div class="panel-body" id="leftPane"></div>
      </section>

      <section class="panel workload-panel">
        <div class="panel-head">
          <div class="panel-title">Profile workload</div>
          <div class="select-wrap">
            <label for="workloadSample">Workload</label>
            <select id="workloadSample"></select>
          </div>
        </div>
        <div class="panel-body">
          <textarea id="workloadInput" spellcheck="false" placeholder="Enter profile workload Python here"></textarea>
        </div>
      </section>
    </div>

    <section class="panel views-panel">
      <div class="panel-head">
        <div class="panel-head-meta">
          <div class="panel-title" id="viewTitle">BlockPy</div>
          <div class="panel-substatus" id="viewStatus">ready</div>
        </div>
        <div class="select-wrap">
          <label for="clifFunction">Function</label>
          <select id="clifFunction"></select>
        </div>
      </div>
      <div class="view-tabs" id="viewTabs" role="tablist" aria-label="Inspector views">
        <button class="view-tab active" type="button" data-view="codegen">BlockPy</button>
        <button class="view-tab" type="button" data-view="typed">Post-opt InstrTyped</button>
        <button class="view-tab" type="button" data-view="clif">CLIF</button>
        <button class="view-tab" type="button" data-view="vcode">VCode</button>
      </div>
      <div class="panel-body view-body">
        <div class="typed-metadata" id="typedMetadata" hidden>
          <div class="summary-grid" id="optimizationSummary"></div>
          <div class="decision-list" id="optimizationDecisions"></div>
        </div>
        <pre id="viewPane">; BlockPy will appear here.</pre>
      </div>
    </section>
  </main>
</div>

<script>
const leftPaneEl = document.getElementById("leftPane");
const sourceSampleEl = document.getElementById("sourceSample");
const contextStatusEl = document.getElementById("contextStatus");
const statusEl = document.getElementById("status");
const clifFunctionEl = document.getElementById("clifFunction");
const workloadSampleEl = document.getElementById("workloadSample");
const workloadInputEl = document.getElementById("workloadInput");
const viewTabsEl = document.getElementById("viewTabs");
const viewTitleEl = document.getElementById("viewTitle");
const viewStatusEl = document.getElementById("viewStatus");
const viewPaneEl = document.getElementById("viewPane");
const typedMetadataEl = document.getElementById("typedMetadata");
const optimizationSummaryEl = document.getElementById("optimizationSummary");
const optimizationDecisionsEl = document.getElementById("optimizationDecisions");

const VIEW_DEFS = [
  {
    key: "codegen",
    label: "BlockPy",
    emptyText: "; BlockPy will appear here.",
    emptyStatus: "Waiting for lowering.",
  },
  {
    key: "typed",
    label: "Post-opt InstrTyped",
    emptyText: "; Post-opt InstrTyped will appear here.",
    emptyStatus: "Waiting for typed metadata.",
  },
  {
    key: "clif",
    label: "CLIF",
    emptyText: "; CLIF will appear here.",
    emptyStatus: "Waiting for CLIF.",
  },
  {
    key: "vcode",
    label: "VCode",
    emptyText: "; VCode will appear here.",
    emptyStatus: "Waiting for VCode.",
  },
];

const state = {
  source: "",
  steps: [],
  functions: [],
  selectedFunctionKey: null,
  workload: "",
  selectedViewKey: "codegen",
  clifRequestSerial: 0,
  explainRequestSerial: 0,
  viewTexts: Object.fromEntries(VIEW_DEFS.map((view) => [view.key, view.emptyText])),
  viewStatuses: Object.fromEntries(
    VIEW_DEFS.map((view) => [view.key, { message: view.emptyStatus, isError: false }])
  ),
};

const CUSTOM_SAMPLE_KEY = "__custom__";

const SOURCE_SAMPLES = [
  {
    key: "classify",
    label: "classify",
    source: `def classify(n):
    if n < 0:
        return "neg"
    if n == 0:
        return "zero"
    return "pos"`,
  },
  {
    key: "class_def",
    label: "class definition",
    source: `class Counter:
    scale = 2

    def __init__(self, start):
        self.value = start
        self.name = "counter"

    def increment(self):
        self.value += 1
        return self.value

    def scaled(self):
        return self.value * self.scale`,
  },
  {
    key: "closure",
    label: "closure",
    source: `def incrementer():
    n = 1

    def inner():
        nonlocal n
        n += 1
        return n

    return inner`,
  },
  {
    key: "generator",
    label: "generator",
    source: `def seq(n):
    for i in range(n):
        yield i`,
  },
  {
    key: "async",
    label: "async functions",
    source: `async def foo():
    return 1

async def bar():
    return (await foo()) + 1`,
  },
  {
    key: "async_generator",
    label: "async generator",
    source: `async def aseq(n):
    for i in range(n):
        yield i

async def sum():
    n = 0
    async for i in aseq(5):
        n += i
    return n`,
  },
  {
    key: "with_stmt",
    label: "with statement",
    source: `from contextlib import nullcontext

def load_value():
    with nullcontext(1) as value:
        return value`,
  },
  {
    key: "async_with_stmt",
    label: "async with statement",
    source: `class AsyncLock:
    async def __aenter__(self):
        return 1

    async def __aexit__(self, exc_type, exc, tb):
        return False

async def use_lock():
    async with AsyncLock() as value:
        return value`,
  },
];

const DEFAULT_SAMPLE = SOURCE_SAMPLES[0];

const WORKLOAD_SAMPLES = [
  {
    key: "classify_loop",
    sourceSampleKey: "classify",
    label: "classify loop",
    workload: `for i in range(1000):
    classify(i - 500)`,
  },
  {
    key: "counter_loop",
    sourceSampleKey: "class_def",
    label: "counter loop",
    workload: `counter = Counter(0)
for _ in range(1000):
    counter.increment()
    counter.scaled()`,
  },
  {
    key: "closure_loop",
    sourceSampleKey: "closure",
    label: "closure loop",
    workload: `next_value = incrementer()
for _ in range(1000):
    next_value()`,
  },
  {
    key: "generator_loop",
    sourceSampleKey: "generator",
    label: "generator loop",
    workload: `for _ in range(200):
    list(seq(20))`,
  },
  {
    key: "async_loop",
    sourceSampleKey: "async",
    label: "async loop",
    workload: `import asyncio

async def workload():
    for _ in range(200):
        await bar()

asyncio.run(workload())`,
  },
  {
    key: "async_generator_loop",
    sourceSampleKey: "async_generator",
    label: "async generator",
    workload: `import asyncio

async def workload():
    for _ in range(100):
        await sum()

asyncio.run(workload())`,
  },
  {
    key: "with_loop",
    sourceSampleKey: "with_stmt",
    label: "with loop",
    workload: `for _ in range(1000):
    load_value()`,
  },
  {
    key: "async_with_loop",
    sourceSampleKey: "async_with_stmt",
    label: "async with loop",
    workload: `import asyncio

async def workload():
    for _ in range(200):
        await use_lock()

asyncio.run(workload())`,
  },
];

const CUSTOM_WORKLOAD_KEY = "__custom_workload__";

function debounce(fn, delayMs) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delayMs);
  };
}

function setStatus(message, isError = false) {
  statusEl.textContent = message;
  statusEl.style.color = isError ? "#ff8c69" : "var(--ink-1)";
}

function updateQueryParams() {
  const params = new URLSearchParams(window.location.search);
  if (state.source) {
    params.set("src", state.source);
  } else {
    params.delete("src");
  }
  if (state.workload) {
    params.set("workload", state.workload);
  } else {
    params.delete("workload");
  }
  if (state.selectedViewKey && state.selectedViewKey !== "codegen") {
    params.set("view", state.selectedViewKey);
  } else {
    params.delete("view");
  }
  const query = params.toString();
  history.replaceState(null, "", query ? `?${query}` : window.location.pathname);
}

function isEditableTarget(target) {
  return target instanceof HTMLElement &&
    (target.tagName === "TEXTAREA" ||
      target.tagName === "INPUT" ||
      target.isContentEditable);
}

function blockLinkScopeId(scope, token) {
  return `block-target-${scope}-${token}`.replace(/[^A-Za-z0-9_-]/g, "_");
}

function blockHeaderMatch(line) {
  return line.match(/^(\s*)(block\d+|[A-Za-z_][A-Za-z0-9_]*)\s*(?:\([^)]*\))?:/);
}

function annotatedBlockMatch(line) {
  return line.match(/;\s*block\s+(block\d+|[A-Za-z_][A-Za-z0-9_]*)\s*(?:\(|$)/);
}

function collectBlockDefinitions(lines) {
  const definitions = new Map();
  lines.forEach((line, lineIndex) => {
    const header = blockHeaderMatch(line);
    if (header) {
      definitions.set(header[2], lineIndex);
    }
    const annotation = annotatedBlockMatch(line);
    if (annotation) {
      definitions.set(annotation[1], lineIndex);
    }
  });
  return definitions;
}

function tokenOverlapsRanges(start, end, ranges) {
  return ranges.some(([rangeStart, rangeEnd]) => start < rangeEnd && end > rangeStart);
}

function definitionRangesForLine(line) {
  const ranges = [];
  const header = blockHeaderMatch(line);
  if (header) {
    const start = header[1].length;
    ranges.push([start, start + header[2].length]);
  }
  const annotation = annotatedBlockMatch(line);
  if (annotation) {
    const start = annotation.index + annotation[0].indexOf(annotation[1]);
    ranges.push([start, start + annotation[1].length]);
  }
  return ranges;
}

function appendLinkedBlockLine(lineContentEl, line, definitions, scope) {
  const tokenRegex = /\b(?:block\d+|[A-Za-z_][A-Za-z0-9_]*)\b/g;
  const skipRanges = definitionRangesForLine(line);
  let cursor = 0;
  for (const match of line.matchAll(tokenRegex)) {
    const token = match[0];
    const start = match.index;
    const end = start + token.length;
    if (!definitions.has(token) || tokenOverlapsRanges(start, end, skipRanges)) {
      continue;
    }
    if (start > cursor) {
      lineContentEl.appendChild(document.createTextNode(line.slice(cursor, start)));
    }
    const link = document.createElement("a");
    link.className = "block-link";
    link.href = `#${blockLinkScopeId(scope, token)}`;
    link.textContent = token;
    lineContentEl.appendChild(link);
    cursor = end;
  }
  if (cursor < line.length) {
    lineContentEl.appendChild(document.createTextNode(line.slice(cursor)));
  }
  if (!line.length) {
    lineContentEl.appendChild(document.createTextNode("\u200b"));
  }
}

function clearLinkedBlockHighlight() {
  document
    .querySelectorAll(".linked-block-line.linked-block-target")
    .forEach((line) => line.classList.remove("linked-block-target"));
}

function applyLinkedBlockHighlight() {
  clearLinkedBlockHighlight();
  const rawHash = window.location.hash.slice(1);
  if (!rawHash) {
    return;
  }
  const target = document.getElementById(decodeURIComponent(rawHash));
  const line = target?.closest(".linked-block-line");
  if (line) {
    line.classList.add("linked-block-target");
  }
}

function renderLinkedBlockText(container, text, scopePrefix) {
  const scope = String(scopePrefix || "text");
  const lines = String(text || "").split("\n");
  const definitions = collectBlockDefinitions(lines);
  container.innerHTML = "";
  for (let lineIndex = 0; lineIndex < lines.length; lineIndex += 1) {
    const line = document.createElement("span");
    line.className = "linked-block-line";
    for (const [token, definitionLineIndex] of definitions.entries()) {
      if (definitionLineIndex !== lineIndex) {
        continue;
      }
      const anchor = document.createElement("span");
      anchor.className = "block-target";
      anchor.id = blockLinkScopeId(scope, token);
      line.appendChild(anchor);
    }
    const content = document.createElement("span");
    appendLinkedBlockLine(content, lines[lineIndex], definitions, scope);
    line.appendChild(content);
    container.appendChild(line);
  }
  requestAnimationFrame(applyLinkedBlockHighlight);
}

function makeSourceEditor() {
  const textarea = document.createElement("textarea");
  textarea.spellcheck = false;
  textarea.placeholder = "Paste Python code here";
  textarea.value = state.source;
  textarea.addEventListener("input", () => {
    state.source = textarea.value;
    syncSourceSampleSelection();
    renderWorkloadSampleSelector();
    debouncedInspect();
  });
  return textarea;
}

function sampleForKey(key) {
  return SOURCE_SAMPLES.find((sample) => sample.key === key) || null;
}

function sampleKeyForSource(source) {
  return SOURCE_SAMPLES.find((sample) => sample.source === source)?.key || CUSTOM_SAMPLE_KEY;
}

function workloadForKey(key) {
  return WORKLOAD_SAMPLES.find((sample) => sample.key === key) || null;
}

function defaultWorkloadForSource(source) {
  const sourceKey = sampleKeyForSource(source);
  return WORKLOAD_SAMPLES.find((sample) => sample.sourceSampleKey === sourceKey)
    || WORKLOAD_SAMPLES[0];
}

function workloadKeyForText(workload) {
  return WORKLOAD_SAMPLES.find((sample) => sample.workload === workload)?.key || CUSTOM_WORKLOAD_KEY;
}

function workloadSamplesForCurrentSource() {
  const sourceKey = sampleKeyForSource(state.source);
  const matching = WORKLOAD_SAMPLES.filter((sample) => sample.sourceSampleKey === sourceKey);
  return matching.length ? matching : WORKLOAD_SAMPLES;
}

function renderSourceSampleSelector() {
  sourceSampleEl.innerHTML = "";
  for (const sample of SOURCE_SAMPLES) {
    const option = document.createElement("option");
    option.value = sample.key;
    option.textContent = sample.label;
    sourceSampleEl.appendChild(option);
  }
  const customOption = document.createElement("option");
  customOption.value = CUSTOM_SAMPLE_KEY;
  customOption.textContent = "custom";
  sourceSampleEl.appendChild(customOption);
  syncSourceSampleSelection();
}

function renderWorkloadSampleSelector() {
  workloadSampleEl.innerHTML = "";
  for (const sample of workloadSamplesForCurrentSource()) {
    const option = document.createElement("option");
    option.value = sample.key;
    option.textContent = sample.label;
    workloadSampleEl.appendChild(option);
  }
  const customOption = document.createElement("option");
  customOption.value = CUSTOM_WORKLOAD_KEY;
  customOption.textContent = "custom";
  workloadSampleEl.appendChild(customOption);
  syncWorkloadSampleSelection();
}

function syncSourceSampleSelection() {
  sourceSampleEl.value = sampleKeyForSource(state.source);
}

function syncWorkloadSampleSelection() {
  workloadSampleEl.value = workloadKeyForText(state.workload);
}

function syncWorkloadEditor() {
  if (workloadInputEl.value !== state.workload) {
    workloadInputEl.value = state.workload;
  }
  syncWorkloadSampleSelection();
}

function clifFunctionKey(fn) {
  return `${fn.functionId}:${fn.qualname}:${fn.entryLabel}`;
}

function selectedClifFunction() {
  return state.functions.find((fn) => clifFunctionKey(fn) === state.selectedFunctionKey) || null;
}

function defaultClifFunction(functions) {
  return functions.find((fn) => fn.qualname !== "_dp_module_init") || functions[0] || null;
}

function normalizeFunctions(payload) {
  if (!Array.isArray(payload)) {
    return [];
  }
  return payload.filter((fn) =>
    fn &&
    typeof fn.functionId === "string" &&
    typeof fn.qualname === "string" &&
    typeof fn.displayName === "string" &&
    typeof fn.bindName === "string" &&
    typeof fn.kind === "string" &&
    typeof fn.entryLabel === "string"
  );
}

function renderFunctionSelector() {
  const previousValue = state.selectedFunctionKey;
  clifFunctionEl.innerHTML = "";
  if (!state.functions.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "No lowered functions";
    clifFunctionEl.appendChild(option);
    clifFunctionEl.disabled = true;
    state.selectedFunctionKey = null;
    updateContextStatus();
    return;
  }

  for (const fn of state.functions) {
    const option = document.createElement("option");
    option.value = clifFunctionKey(fn);
    option.textContent = `${fn.qualname} [fn#${fn.functionId} | ${fn.kind}]`;
    clifFunctionEl.appendChild(option);
  }
  clifFunctionEl.disabled = false;

  const defaultFunction = defaultClifFunction(state.functions);
  const defaultKey = defaultFunction ? clifFunctionKey(defaultFunction) : "";
  state.selectedFunctionKey = state.functions.some((fn) => clifFunctionKey(fn) === previousValue)
    ? previousValue
    : defaultKey;
  clifFunctionEl.value = state.selectedFunctionKey;
  updateContextStatus();
}

function renderSourceEditor(container) {
  const existing = container.querySelector("textarea");
  if (existing) {
    if (existing.value !== state.source) {
      existing.value = state.source;
    }
    return;
  }
  container.innerHTML = "";
  container.appendChild(makeSourceEditor());
}

function viewDefForKey(key) {
  return VIEW_DEFS.find((view) => view.key === key) || VIEW_DEFS[0];
}

function setViewText(viewKey, text) {
  state.viewTexts[viewKey] = text || viewDefForKey(viewKey).emptyText;
  if (state.selectedViewKey === viewKey) {
    renderSelectedView();
  }
}

function setViewStatus(viewKey, message, isError = false) {
  state.viewStatuses[viewKey] = { message, isError };
  if (state.selectedViewKey === viewKey) {
    viewStatusEl.textContent = message;
    viewStatusEl.style.color = isError ? "#ff8c69" : "var(--ink-1)";
  }
}

function updateContextStatus() {
  const selected = selectedClifFunction();
  contextStatusEl.textContent = selected
    ? `${selected.qualname} | fn#${selected.functionId}`
    : "No lowered function selected";
}

function renderViewTabs() {
  for (const tab of viewTabsEl.querySelectorAll(".view-tab")) {
    const isActive = tab.dataset.view === state.selectedViewKey;
    tab.classList.toggle("active", isActive);
    tab.setAttribute("aria-selected", isActive ? "true" : "false");
  }
}

function renderSelectedView() {
  const view = viewDefForKey(state.selectedViewKey);
  const status = state.viewStatuses[view.key] || {
    message: view.emptyStatus,
    isError: false,
  };
  viewTitleEl.textContent = view.label;
  viewStatusEl.textContent = status.message;
  viewStatusEl.style.color = status.isError ? "#ff8c69" : "var(--ink-1)";
  typedMetadataEl.hidden = view.key !== "typed";
  renderViewTabs();
  renderLinkedBlockText(
    viewPaneEl,
    state.viewTexts[view.key] || view.emptyText,
    `${view.key}-${state.selectedFunctionKey || "module"}`
  );
}

function codegenStep() {
  const laterSteps = state.steps.filter((step) => step.key !== "input_source");
  return state.steps.find((step) => step.key === "bb_codegen")
    || state.steps.find((step) => step.key && step.key.includes("codegen"))
    || laterSteps[laterSteps.length - 1]
    || null;
}

function updateCodegenView() {
  const step = codegenStep();
  setViewText("codegen", step?.text || "; BlockPy will appear here.");
  setViewStatus(
    "codegen",
    step ? `${step.label || step.key} | ${state.functions.length} function(s)` : "No BlockPy output.",
    !step
  );
}

function renderInputs() {
  renderSourceEditor(leftPaneEl);
  syncSourceSampleSelection();
  syncWorkloadEditor();
}

async function inspectPipeline(source) {
  const response = await fetch("/api/inspect_pipeline", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ source }),
  });
  const payload = await response.json();
  if (!response.ok) {
    throw new Error(payload.error || "inspect pipeline request failed");
  }
  return payload;
}

async function renderActualClif() {
  const source = state.source;
  const selected = selectedClifFunction();
  if (!source.trim()) {
    setViewText("clif", "; CLIF will appear here.");
    setViewText("vcode", "; VCode will appear here.");
    setViewStatus("clif", "Enter source to render CLIF.");
    setViewStatus("vcode", "Enter source to render VCode.");
    return;
  }
  if (!selected) {
    setViewText("clif", "; No lowered functions available.");
    setViewText("vcode", "; No lowered functions available.");
    setViewStatus("clif", "No lowered function is available.", true);
    setViewStatus("vcode", "No lowered function is available.", true);
    return;
  }

  const requestSerial = ++state.clifRequestSerial;
  setViewStatus("clif", `Loading CLIF for ${selected.qualname}...`);
  setViewStatus("vcode", `Loading VCode for ${selected.qualname}...`);
  setViewText("clif", "; loading CLIF...");
  setViewText("vcode", "; loading VCode...");
  try {
    const response = await fetch("/api/jit_clif", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        source,
        functionId: selected.functionId,
        qualname: selected.qualname,
        entryLabel: selected.entryLabel,
      }),
    });
    const payload = await response.json();
    if (requestSerial !== state.clifRequestSerial) {
      return;
    }
    if (!response.ok) {
      throw new Error(payload.error || "jit_clif request failed");
    }
    setViewText("clif", payload.clif || "; no CLIF returned");
    setViewText("vcode", payload.vcodeDisasm || "; no VCode disassembly returned");
    setViewStatus(
      "clif",
      payload.resolved_entry
        ? `Post-opt CLIF | ${payload.resolved_entry}`
        : `Post-opt CLIF | ${selected.qualname}`
    );
    setViewStatus(
      "vcode",
      payload.resolved_entry
        ? `VCode | ${payload.resolved_entry}`
        : `VCode | ${selected.qualname}`
    );
  } catch (error) {
    if (requestSerial !== state.clifRequestSerial) {
      return;
    }
    setViewStatus("clif", "CLIF unavailable", true);
    setViewStatus("vcode", "VCode unavailable", true);
    const message = `; Unable to load generated code.\n\n${String(error)}`;
    setViewText("clif", message);
    setViewText("vcode", message);
  }
}

function setOptimizationPlaceholders(message) {
  optimizationSummaryEl.innerHTML = "";
  optimizationDecisionsEl.innerHTML = "";
  const placeholder = document.createElement("div");
  placeholder.className = "placeholder";
  placeholder.textContent = message;
  optimizationDecisionsEl.appendChild(placeholder);
  setViewText("typed", "; Post-opt InstrTyped will appear here.");
}

function renderOptimizationSummary(summary) {
  optimizationSummaryEl.innerHTML = "";
  const items = Array.isArray(summary) ? summary : [];
  for (const item of items) {
    const card = document.createElement("div");
    card.className = "summary-item";

    const label = document.createElement("div");
    label.className = "summary-label";
    label.textContent = item?.label || "summary";
    card.appendChild(label);

    const value = document.createElement("div");
    value.className = "summary-value";
    value.textContent = item?.value || "";
    card.appendChild(value);

    if (item?.detail) {
      const detail = document.createElement("div");
      detail.className = "summary-detail";
      detail.textContent = item.detail;
      card.appendChild(detail);
    }
    optimizationSummaryEl.appendChild(card);
  }
}

function formatDecisionSource(source) {
  if (!source || typeof source !== "object" || !source.instr) {
    return "";
  }
  const parts = [source.instr];
  if (source.block) {
    parts.push(`block ${source.block}`);
  }
  if (Number.isInteger(source.bodyIndex)) {
    parts.push(`body ${source.bodyIndex}`);
  }
  return parts.join(" | ");
}

function renderOptimizationDecisions(decisions) {
  optimizationDecisionsEl.innerHTML = "";
  const items = Array.isArray(decisions) ? decisions : [];
  if (!items.length) {
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.textContent = "No optimization decisions were returned.";
    optimizationDecisionsEl.appendChild(placeholder);
    return;
  }

  for (const decision of items) {
    const card = document.createElement("div");
    card.className = "decision-card";

    const head = document.createElement("div");
    head.className = "decision-head";

    const left = document.createElement("div");
    const kind = document.createElement("div");
    kind.className = "decision-kind";
    kind.textContent = decision?.kind || "decision";
    left.appendChild(kind);

    const title = document.createElement("div");
    title.className = "decision-title";
    title.textContent = decision?.title || "";
    left.appendChild(title);
    head.appendChild(left);

    const status = document.createElement("div");
    status.className = `decision-status ${decision?.status || ""}`;
    status.textContent = decision?.status || "unknown";
    head.appendChild(status);
    card.appendChild(head);

    if (decision?.detail) {
      const detail = document.createElement("div");
      detail.className = "decision-detail";
      detail.textContent = decision.detail;
      card.appendChild(detail);
    }

    const source = formatDecisionSource(decision?.source);
    if (source) {
      const sourceEl = document.createElement("div");
      sourceEl.className = "decision-source";
      sourceEl.textContent = source;
      card.appendChild(sourceEl);
    }

    if (decision?.metadata && Object.keys(decision.metadata).length) {
      const metadata = document.createElement("div");
      metadata.className = "decision-metadata";
      metadata.textContent = JSON.stringify(decision.metadata);
      card.appendChild(metadata);
    }

    optimizationDecisionsEl.appendChild(card);
  }
}

async function renderOptimizationExplain() {
  const source = state.source;
  const selected = selectedClifFunction();
  if (!source.trim()) {
    setViewStatus("typed", "Enter source to inspect typed metadata.");
    setOptimizationPlaceholders("No source is loaded.");
    return;
  }
  if (!selected) {
    setViewStatus("typed", "No lowered function is available for typed metadata.", true);
    setOptimizationPlaceholders("No lowered functions available.");
    return;
  }

  const requestSerial = ++state.explainRequestSerial;
  setViewStatus("typed", `Loading typed metadata for ${selected.qualname}...`);
  setViewText("typed", "; loading post-opt InstrTyped...");
  try {
    const response = await fetch("/api/optimization_explain", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        source,
        workload: state.workload,
        functionId: selected.functionId,
      }),
    });
    const payload = await response.json();
    if (requestSerial !== state.explainRequestSerial) {
      return;
    }
    if (!response.ok) {
      throw new Error(payload.error || "optimization_explain request failed");
    }
    renderOptimizationSummary(payload.summary);
    renderOptimizationDecisions(payload.decisions);
    setViewText("typed", payload.instrTyped || "; no InstrTyped render returned");
    const workloadStatus = payload.workload?.status || "unknown workload";
    const profileStatus = payload.profile?.status || "unknown profile";
    setViewStatus("typed", `${selected.qualname} | workload ${workloadStatus} | profile ${profileStatus}`);
  } catch (error) {
    if (requestSerial !== state.explainRequestSerial) {
      return;
    }
    setViewStatus("typed", "Typed metadata unavailable", true);
    setOptimizationPlaceholders(String(error));
    setViewText("typed", `; Unable to load post-opt InstrTyped.\n\n${String(error)}`);
  }
}

const debouncedExplain = debounce(() => {
  void renderOptimizationExplain();
}, 200);

async function inspectNow() {
  const source = state.source;
  if (!source.trim()) {
    state.steps = [
      {
        key: "input_source",
        label: "input source",
        text: "",
      },
    ];
    state.functions = [];
    state.selectedFunctionKey = null;
    renderInputs();
    renderFunctionSelector();
    updateCodegenView();
    await renderActualClif();
    await renderOptimizationExplain();
    renderSelectedView();
    updateQueryParams();
    setStatus("ready");
    return;
  }

  try {
    const payload = await inspectPipeline(source);
    state.steps = Array.isArray(payload.steps) ? payload.steps : [];
    state.functions = normalizeFunctions(payload.functions);
    renderInputs();
    renderFunctionSelector();
    updateCodegenView();
    renderSelectedView();
    await renderActualClif();
    await renderOptimizationExplain();
    updateQueryParams();
    setStatus(`ok | ${Math.max(0, state.steps.length - 1)} tracked pass${state.steps.length === 2 ? "" : "es"}`);
  } catch (error) {
    state.steps = [
      {
        key: "input_source",
        label: "input source",
        text: source,
      },
      {
        key: "error",
        label: "transform error",
        text: String(error),
      },
    ];
    state.functions = [];
    state.selectedFunctionKey = null;
    renderInputs();
    renderFunctionSelector();
    updateCodegenView();
    await renderActualClif();
    await renderOptimizationExplain();
    renderSelectedView();
    updateQueryParams();
    setStatus("transform error", true);
  }
}

const debouncedInspect = debounce(() => {
  void inspectNow();
}, 150);

async function run() {
  const params = new URLSearchParams(window.location.search);
  state.source = params.get("src") || DEFAULT_SAMPLE.source;
  state.workload = params.get("workload") || defaultWorkloadForSource(state.source).workload;
  state.selectedViewKey = VIEW_DEFS.some((view) => view.key === params.get("view"))
    ? params.get("view")
    : "codegen";
  renderSourceSampleSelector();
  renderWorkloadSampleSelector();
  renderInputs();
  renderSelectedView();

  sourceSampleEl.addEventListener("change", () => {
    if (sourceSampleEl.value === CUSTOM_SAMPLE_KEY) {
      const textarea = leftPaneEl.querySelector("textarea");
      textarea?.focus();
      return;
    }
    const sample = sampleForKey(sourceSampleEl.value);
    if (!sample) {
      return;
    }
    state.source = sample.source;
    state.workload = defaultWorkloadForSource(state.source).workload;
    renderWorkloadSampleSelector();
    renderInputs();
    void inspectNow();
  });
  workloadSampleEl.addEventListener("change", () => {
    if (workloadSampleEl.value === CUSTOM_WORKLOAD_KEY) {
      workloadInputEl.focus();
      return;
    }
    const sample = workloadForKey(workloadSampleEl.value);
    if (!sample) {
      return;
    }
    state.workload = sample.workload;
    syncWorkloadEditor();
    void renderOptimizationExplain();
    updateQueryParams();
  });
  viewTabsEl.addEventListener("click", (event) => {
    const tab = event.target.closest(".view-tab");
    if (!tab) {
      return;
    }
    state.selectedViewKey = tab.dataset.view || "codegen";
    renderSelectedView();
    updateQueryParams();
  });
  workloadInputEl.addEventListener("input", () => {
    state.workload = workloadInputEl.value;
    syncWorkloadSampleSelection();
    debouncedExplain();
    updateQueryParams();
  });
  window.addEventListener("hashchange", applyLinkedBlockHighlight);
  clifFunctionEl.addEventListener("change", () => {
    state.selectedFunctionKey = clifFunctionEl.value || null;
    updateContextStatus();
    renderSelectedView();
    void renderActualClif();
    void renderOptimizationExplain();
  });

  await inspectNow();
}

run();
</script>
</body>
</html>
