[package]
name = "soac-inspector"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
axum = "0.8"
soac-lowering = { path = "../soac-lowering" }
soac-config = { path = "../soac-config" }
soac-core = { path = "../soac-core" }
soac-profile = { path = "../soac-profile" }
soac-opt = { path = "../soac-opt" }
soac-cpython = { path = "../soac-cpython" }
pyo3 = { workspace = true }
rkyv = { version = "0.8", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soac-jit = { path = "../soac-jit" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"

[build-dependencies]
build_support = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
