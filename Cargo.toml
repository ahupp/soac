[workspace]
members = [
    "crates/build_support",
    "crates/soac_core",
    "crates/soac_contracts",
    "crates/soac_source",
    "crates/soac_ir_blockpy",
    "crates/soac_ir_typed",
    "crates/soac_opt",
    "crates/soac_instrument",
    "crates/soac_driver",
    "crates/soac_config",
    "crates/soac_cpython",
    "crates/soac_lowering",
    "crates/soac_pyo3",
    "crates/soac_jit",
    "crates/soac_inspector",
    "crates/soac_macros",
]
default-members = [
    "crates/soac_core",
    "crates/soac_contracts",
    "crates/soac_source",
    "crates/soac_ir_blockpy",
    "crates/soac_ir_typed",
    "crates/soac_opt",
    "crates/soac_instrument",
    "crates/soac_driver",
    "crates/soac_config",
    "crates/soac_cpython",
    "crates/soac_lowering",
    "crates/soac_pyo3",
    "crates/soac_jit",
    "crates/soac_inspector",
]
# The local runtime and offline checker have independent build pipelines.
# Vendored dependencies and uv's native Python build sources are independent
# workspaces too; a repo-local cache must not make them implicit SOAC members.
exclude = ["crates/soac_jit_runtime", "tools/ty", "vendor/ruff", "work", ".uv-cache"]
resolver = "2"

[profile.release-ext]
inherits = "release"
panic = "abort"

[workspace.dependencies]
build_support = { path = "crates/build_support" }
pyo3 = { git = "https://github.com/PyO3/pyo3", branch = "main" }
pyo3-ffi = { git = "https://github.com/PyO3/pyo3", branch = "main" }
ruff_python_ast = { path = "vendor/ruff/crates/ruff_python_ast" }
ruff_python_codegen = { path = "vendor/ruff/crates/ruff_python_codegen" }
ruff_python_parser = { path = "vendor/ruff/crates/ruff_python_parser" }
ruff_python_semantic = { path = "vendor/ruff/crates/ruff_python_semantic" }
ruff_source_file = { path = "vendor/ruff/crates/ruff_source_file" }
ruff_text_size = { path = "vendor/ruff/crates/ruff_text_size" }

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-jit]
opt-level = 3

[profile.dev.package.cranelift-module]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3
