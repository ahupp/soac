[package]
name = "soac_ty"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# The checker is an offline executable, not a dependency of the runtime.
[workspace]
resolver = "2"

[[bin]]
name = "soac-ty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
toml = "0.9"
soac_contracts = { path = "../../crates/soac_contracts" }
soac_source = { path = "../../crates/soac_source" }
ruff_db = { path = "../../vendor/ruff/crates/ruff_db", features = ["os", "serde"] }
ruff_notebook = { path = "../../vendor/ruff/crates/ruff_notebook" }
ruff_python_ast = { path = "../../vendor/ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "../../vendor/ruff/crates/ruff_python_parser" }
ruff_ranged_value = { path = "../../vendor/ruff/crates/ruff_ranged_value" }
ty_project = { path = "../../vendor/ruff/crates/ty_project" }
ty_module_resolver = { path = "../../vendor/ruff/crates/ty_module_resolver" }
ty_python_core = { path = "../../vendor/ruff/crates/ty_python_core" }
ty_python_semantic = { path = "../../vendor/ruff/crates/ty_python_semantic" }

[profile.dev]
debug = 1

[profile.release]
debug = 1
