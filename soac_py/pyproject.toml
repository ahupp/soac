[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soac"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["soac"]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "Django>=5.2,<6",
    "pydantic>=2.13,<3",
    "pyperformance>=1.14.0",
    "pytest>=8,<9",
    "SQLAlchemy>=2,<3",
]
