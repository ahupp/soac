[package]
name = "soac-jit"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
soac-lowering = { path = "../soac-lowering" }
soac-config = { path = "../soac-config" }
soac-core = { path = "../soac-core" }
soac-profile = { path = "../soac-profile" }
anyhow = { version = "1.0.100", features = ["backtrace"] }
ruff_python_ast = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"] }
tracing = "0.1"
cranelift-codegen = { version = "0.130.1", features = ["incremental-cache"] }
cranelift-control = "0.130.1"
cranelift-frontend = "0.130.1"
cranelift-jit = "0.130.1"
cranelift-module = "0.130.1"
cranelift-native = "0.130.1"
cranelift-reader = "0.130.1"
gimli = "0.33.1"
libc = "0.2"
rkyv = { version = "0.8", features = ["alloc"] }
serde_json = "1"

[build-dependencies]
pyo3-build-config = { git = "https://github.com/PyO3/pyo3", branch = "main", features = ["resolve-config"] }

[dev-dependencies]
soac-cpython = { path = "../soac-cpython" }
