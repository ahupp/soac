[package]
name = "soac_jit"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
soac_lowering = { path = "../soac_lowering" }
soac_driver = { path = "../soac_driver" }
soac_config = { path = "../soac_config" }
soac_core = { path = "../soac_core" }
soac_ir_blockpy = { path = "../soac_ir_blockpy" }
soac_ir_typed = { path = "../soac_ir_typed" }
soac_instrument = { path = "../soac_instrument" }
soac_opt = { path = "../soac_opt" }
anyhow = { version = "1.0.100", features = ["backtrace"] }
ruff_python_ast = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"] }
tracing = "0.1"
cranelift-codegen = { version = "0.130.1", features = ["incremental-cache"] }
cranelift-control = "0.130.1"
cranelift-frontend = "0.130.1"
cranelift-jit = "0.130.1"
cranelift-module = "0.130.1"
cranelift-native = "0.130.1"
cranelift-reader = "0.130.1"
gimli = "0.33.1"
libc = "0.2"
serde_json = "1"

[build-dependencies]
build_support = { workspace = true }
pyo3-build-config = { git = "https://github.com/PyO3/pyo3", branch = "main", features = ["resolve-config"] }

[dev-dependencies]
soac_cpython = { path = "../soac_cpython" }
