[package]
name = "soac_inspector"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
axum = "0.8"
soac_lowering = { path = "../soac_lowering" }
soac_driver = { path = "../soac_driver" }
soac_config = { path = "../soac_config" }
soac_core = { path = "../soac_core" }
soac_ir_blockpy = { path = "../soac_ir_blockpy" }
soac_ir_typed = { path = "../soac_ir_typed" }
soac_opt = { path = "../soac_opt" }
soac_cpython = { path = "../soac_cpython" }
pyo3 = { workspace = true }
rkyv = { version = "0.8", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soac_jit = { path = "../soac_jit" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"

[build-dependencies]
build_support = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
